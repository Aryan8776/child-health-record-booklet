<!doctype html><html><head><meta charset="utf-8"><title>Vaccinations</title>
<style>
:root{
--bg:radial-gradient(circle at top left,#2f4369 0,#1f2933 35%,#111827 100%);
--p:#6366f1;--ps:rgba(99,102,241,.16);--a:#f97316;
--card:rgba(15,23,42,.9);--b:rgba(148,163,184,.4);
--t:#e5e7eb;--m:#9ca3af;--s:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui;background:var(--bg);color:var(--t);min-height:100vh}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{padding:18px;border-right:1px solid var(--b);background:linear-gradient(180deg,rgba(15,23,42,.97),rgba(17,24,39,.97))}
.nav a{display:flex;gap:8px;padding:8px 10px;border-radius:12px;color:var(--m)}
.nav a.active,.nav a:hover{background:rgba(37,99,235,.16);border:1px solid rgba(129,140,248,.7);color:#fff}
.main{padding:18px}
.card{background:var(--card);border:1px solid var(--b);border-radius:18px;padding:14px;margin-bottom:14px}
.btn{padding:8px 14px;border-radius:999px;border:1px solid rgba(129,140,248,.8);background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff}
.pill{display:inline-block;padding:3px 8px;border-radius:999px;border:1px solid var(--b);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px;border-bottom:1px solid rgba(55,65,81,.7)}
</style>
</head>
<body><div class="app">
<div class="sidebar"><h3>Child Health</h3><div class="nav">
<a href="dashboard.html">Dashboard</a><a class="active" href="vaccinations.html">Vaccinations</a></div></div>
<div class="main">
<div class="card"><p>Next vaccine in <b>12 days</b></p></div>
<div class="card">
<button class="btn" onclick="makePDF()">Download Card</button>
</div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
function makePDF(){ var p=new jspdf.jsPDF(); p.text('Vaccination Card',20,20); p.text('BCG - Done',20,30); p.save('card.pdf'); }
</script></body></html>
